name: github-release

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      release-branch:
        description: "Branch to create release from"
        required: false
        default: "main"
      increment:
        description: "Version increment type"
        required: false
        type: choice
        options:
          - patch
          - minor
          - major
        default: "patch"
      prerelease_type:
        description: "Prerelease type"
        required: false
        type: choice
        options:
          - none
          - alpha
          - beta
          - rc
        default: "none"
      draft:
        description: "Create as draft release"
        required: false
        type: boolean
        default: false

jobs:
  pure-wheel-test:
    uses: ./.github/workflows/pure-wheel-test.yml

  release:
    needs: pure-wheel-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.release-branch }}

      - name: Check actor is a repository admin
        run: |
          PERMISSION=$(gh api repos/${{ github.repository }}/collaborators/${{ github.actor }}/permission --jq '.permission')
          echo "Permission level for ${{ github.actor }}: $PERMISSION"
          if [ "$PERMISSION" != "admin" ]; then
            echo "::error::${{ github.actor }} is not a repository admin. Only admins can trigger releases."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # pyramids-lazy is pinned by a git commit on an unmerged branch (see pyproject.toml). Releasing
      # in that state is unsafe: the release step re-locks, and a git-pinned dependency makes the
      # lock non-reproducible and breaks the moment that branch is deleted. Refuse until the pin is an
      # ordinary version floor (i.e. pyramids-lazy has shipped). Fail here with a clear message rather
      # than let `pixi lock` fail cryptically after a tag has been pushed.
      - name: Refuse to release while pyramids-lazy is a git pin
        run: |
          if grep -Eq 'pyramids-lazy @ git\+' pyproject.toml; then
            echo "::error::pyramids-lazy is still pinned by git commit in pyproject.toml. A release" \
                 "would produce a non-reproducible lock and break when the plugin branch is deleted." \
                 "Publish pyramids-lazy and replace the git pin with a version floor first."
            exit 1
          fi

      - name: Create GitHub Release with Commitizen
        uses: serapeum-org/github-actions/actions/release/github@961524686fb512c05ca8e4c7bfe81ba68eef4dda  # github-release/v1.5.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          increment: ${{ github.event.inputs.increment }}
          prerelease-type: ${{ github.event.inputs.prerelease_type }}
          draft: ${{ github.event.inputs.draft }}
          package-manager: pixi
          package-manager-version: v0.73.0
          install-groups: "dev"

      - name: Update lockfile after version bump
        run: pixi lock

      - name: Commit and push updated lockfile
        env:
          RELEASE_BRANCH: ${{ inputs.release-branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pixi.lock
          git diff --cached --quiet && echo "No lockfile changes" && exit 0
          git commit -m "build: sync pixi.lock after version bump"
          git push origin "$RELEASE_BRANCH"
