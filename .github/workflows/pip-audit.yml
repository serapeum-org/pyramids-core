name: pip-audit

# Dependency-vulnerability scan. Replaces the old `safety` pre-commit hook, which
# was unmaintainable (safety v3 deprecated `safety check` and now requires an API
# key) and mis-placed: dependencies rarely change per commit, and CVEs are disclosed
# over time against packages we already ship. A CI job on every PR catches a newly
# introduced vulnerable dependency, and the weekly schedule re-audits the unchanged
# tree so a freshly disclosed CVE is caught without needing a code change.

permissions:
  contents: read

on:
  pull_request:
  schedule:
    # Weekly, Monday 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Audit the resolved tree on every supported Python. Each pixi env pins its own
    # Python (py311..py315) and can resolve a slightly different dependency set, so the
    # matrix catches a version-specific vulnerable dependency. fail-fast off so one
    # version's result never hides another's. The set mirrors the tests.yml matrix.
    strategy:
      fail-fast: false
      matrix:
        environment: [py311, py312, py313, py314, py315]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: serapeum-org/github-actions/actions/python-setup/pixi@961524686fb512c05ca8e4c7bfe81ba68eef4dda  # pixi/v1.5.1
        with:
          environments: ${{ matrix.environment }}
          activate-environment: ${{ matrix.environment }}
          cache: true
          version: v0.73.0

      - name: Audit dependencies with pip-audit
        # pip-audit checks installed packages against the PyPI/OSV advisory DB. Conda
        # and PyPI packages both carry site-packages metadata, so a `pip freeze` of the
        # resolved env captures the whole tree; we audit that pinned list. pip-audit is
        # run via pipx so it is never added to the project's own dependency graph.
        # No --strict: a conda-only package with no PyPI advisory record is skipped
        # rather than failing the run — the job fails only when a real vulnerability is
        # reported (pip-audit exits non-zero).
        run: |
          # Pin pip-audit to the SAME interpreter as the matrix env so it never tries to
          # resolve a package the freeze pinned for a different Python (e.g. a cp314/cp315
          # -only wheel) against pipx's default interpreter. The capture is failure-safe: a
          # command substitution inside an assignment is masked under `set -e`, so a broken
          # probe would otherwise leave PYBIN empty and surface as a confusing pipx error —
          # validate it explicitly, and take only the last stdout line in case a future pixi
          # prints a banner to stdout.
          PYBIN="$(pixi run -e ${{ matrix.environment }} python -c 'import sys; print(sys.executable)' | tail -n1)"
          if [ ! -x "$PYBIN" ]; then
            echo "::error::could not locate the ${{ matrix.environment }} interpreter (got '$PYBIN')"
            exit 1
          fi
          pixi run -e ${{ matrix.environment }} python -m pip freeze --exclude-editable \
            | grep -E '^[A-Za-z0-9_.-]+==' > "${RUNNER_TEMP}/pip-audit-reqs.txt"
          echo "Auditing $(wc -l < "${RUNNER_TEMP}/pip-audit-reqs.txt") pinned packages on ${{ matrix.environment }}"
          pipx run --python "$PYBIN" pip-audit --requirement "${RUNNER_TEMP}/pip-audit-reqs.txt" --desc
