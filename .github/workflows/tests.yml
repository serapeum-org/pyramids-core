name: Tests - Suite

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on PRs: a new push to a PR cancels the previous in-progress run
# instead of letting both compete for the (limited, especially macOS) hosted-runner pool.
# main is exempt — every commit merged to main must run the full suite independently, so a
# later merge never cancels an earlier commit's verification. main gets a unique run_id group
# (never shared, never cancelled); PRs keep the per-ref group with cancel-in-progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  main-package:
    runs-on: ${{ matrix.os }}
    # id-token: write is scoped here (not workflow-level) for the Codecov OIDC upload.
    permissions:
      contents: read
      id-token: write
    # Bound a hung test (e.g. a flaky kerchunk/fsspec read in the interop step) so the
    # job fails in minutes instead of running to GitHub's 6-hour default. The full
    # matrix completes in well under this; faulthandler_timeout (pyproject) dumps the
    # offending thread stacks into the log before the cap hits.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        environment: [py311, py312, py313, py314, py315]

    steps:
      # No fetch-depth: the test suite reads the working tree, not git history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: serapeum-org/github-actions/actions/python-setup/pixi@961524686fb512c05ca8e4c7bfe81ba68eef4dda  # pixi/v1.5.1
        with:
          environments: ${{ matrix.environment }}
          activate-environment: ${{ matrix.environment }}
          cache: true
          version: v0.73.0

      - name: Run main tests (not plot, not interop, not vfs, not live)
        # Run pytest directly (not the `main` task) so we can append `not vfs`/`not live`
        # to the selector — the live-network vfs/live tests must not run in CI. Editing
        # the pixi `main` task in pyproject.toml would invalidate pixi.lock and fail the
        # lock-freshness check, so the deselection lives here instead.
        run: pixi run -e ${{ matrix.environment }} pytest -vvv --cov=src/pyramids -sv -m 'not plot and not interop and not vfs and not live' --cov-report=xml --cov-append --cov-fail-under=0

      - name: Run plot tests
        run: pixi run -e ${{ matrix.environment }} plot --cov-fail-under=0

      - name: Run interop tests
        run: pixi run -e ${{ matrix.environment }} interop-tests --cov-fail-under=84

      - name: Upload coverage reports to Codecov with GitHub Action
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1

      - name: test Jupyter notebooks
        run: pixi run -e ${{ matrix.environment }} notebooks

  extras-package:
    # id-token: write is scoped here (not workflow-level) for the Codecov OIDC upload.
    permissions:
      contents: read
      id-token: write
    # One job per optional-dependency group. Each job installs an env that HAS the
    # extra and RUNS that extra's tests, so they execute for real here instead of
    # skipping silently in the main matrix (whose envs omit these extras). Without a
    # job like this an extra's tests skip in every job and a regression merges green —
    # exactly what happened to tests/stac, which had no home until the `stac` target below.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        target:
          # Each target runs in an env that HAS its extra and selects its tests (by marker, or by a
          # path where env-specific routing is needed), so they EXECUTE here instead of skipping in
          # the main matrix (whose envs omit these extras). `strict` appends --strict-extra-skips
          # (turn a missing-dependency skip into a failure) on the jobs whose env is verified to
          # carry every dependency the selected tests need. See docs/how-to/testing.md.
          # Most netcdf_lazy tests moved to pyramids-lazy with the op bodies; five stayed in core
          # (the three CLI kerchunk cases in tests/cli/test_cli_netcdf_io.py and the two in
          # tests/netcdf/samples/test_kerchunk.py), so the marker still needs a job. Selected by
          # marker, not path: the old path-based target broke because the directory it named moved.
          # The `lazy` env carries kerchunk + h5py, so these five RUN here rather than skip, which is
          # why --strict-extra-skips is safe — it also turns a future all-skip degradation into a
          # failure instead of a silently green job.
          - name: netcdf_lazy
            env: lazy
            paths: ""
            markexpr: "netcdf_lazy and not live"
            strict: "--strict-extra-skips"
          # parquet-marked tests (feature/test_arrow, feature/test_geoparquet, io/test_sniff,
          # stac/test_geoparquet_spec) ran in NO CI job; select them in the parquet env, which carries
          # pyarrow and every other dep they need, so --strict-extra-skips is safe here.
          - name: parquet
            env: parquet
            paths: ""
            markexpr: "parquet and not live"
            strict: "--strict-extra-skips"
          # STAC runs the whole suite (mock + real-client) in the dev env, which carries every extra,
          # so a missing-dependency skip there is always a bug -> --strict-extra-skips. NOTE: the
          # strict gate's safety here rests on `stac-asset` being present in the dev env; it reaches
          # it via pixi.lock as the [stac] extra's PyPI dep, not the pixi `stac` conda feature (which
          # only lists pystac-client). If a lock regen ever drops the [stac] PyPI deps, this job goes
          # red (correctly, but citing "mis-routed test") — the fix then is to restore the extra.
          # Bare core: a real environment with NO lazy backend and NO dask, so the branded-absent
          # contract is proven for real, not only under the suite's monkeypatched fixture.
          - name: bare_core_contract
            env: bare
            paths: "tests/base/test_lazy_backend_absent.py"
            markexpr: "not live"
            strict: ""
          - name: stac
            env: dev
            paths: "tests/stac tests/dataset/stac"
            markexpr: "not live"
            strict: "--strict-extra-skips"
          # e2e: run the end-to-end suites as a dedicated leg, selected by the marker, in the dev env
          # (which carries every extra, so the lazy/parquet_lazy-tagged e2e suites execute here too).
          # This gives the `e2e` marker a CI job that selects on it; the core e2e tests also still run
          # in the main matrix, so this is a consolidated signal, not a coverage move.
          - name: e2e
            env: dev
            paths: ""
            markexpr: "e2e and not live"
            strict: ""

    steps:
      # No fetch-depth: the test suite reads the working tree, not git history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: serapeum-org/github-actions/actions/python-setup/pixi@961524686fb512c05ca8e4c7bfe81ba68eef4dda  # pixi/v1.5.1
        with:
          environments: ${{ matrix.target.env }}
          activate-environment: ${{ matrix.target.env }}
          cache: true
          version: v0.73.0

      - name: Run ${{ matrix.target.name }} tests
        # ``--cov-fail-under=0`` overrides the 90% gate from
        # ``[tool.coverage.report]``; extras jobs are intentionally
        # narrow-scope and their coverage is aggregated with the main
        # job at Codecov.
        run: >-
          pixi run -e ${{ matrix.target.env }}
          pytest -vvv ${{ matrix.target.paths }} -m "${{ matrix.target.markexpr }}"
          --cov=src/pyramids --cov-report=xml --cov-report=term-missing
          --cov-fail-under=0 ${{ matrix.target.strict }}

      - name: Upload coverage reports to Codecov with GitHub Action
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
