name: Tests - Suite

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on PRs: a new push to a PR cancels the previous in-progress run
# instead of letting both compete for the (limited, especially macOS) hosted-runner pool.
# main is exempt — every commit merged to main must run the full suite independently, so a
# later merge never cancels an earlier commit's verification. main gets a unique run_id group
# (never shared, never cancelled); PRs keep the per-ref group with cancel-in-progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  main-package:
    runs-on: ${{ matrix.os }}
    # id-token: write is scoped here (not workflow-level) for the Codecov OIDC upload.
    permissions:
      contents: read
      id-token: write
    # Bound a hung test (e.g. a flaky kerchunk/fsspec read in the interop step) so the
    # job fails in minutes instead of running to GitHub's 6-hour default. The full
    # matrix completes in well under this; faulthandler_timeout (pyproject) dumps the
    # offending thread stacks into the log before the cap hits.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        environment: [py311, py312, py313, py314, py315]

    steps:
      # No fetch-depth: the test suite reads the working tree, not git history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: serapeum-org/github-actions/actions/python-setup/pixi@38c111084f99d5ff5f4a1e63bedce48fe33a10c0  # pixi/v1.2.1
        with:
          environments: ${{ matrix.environment }}
          activate-environment: ${{ matrix.environment }}
          cache: true
          version: v0.73.0

      - name: Run main tests (not plot, not interop, not vfs, not live)
        # Run pytest directly (not the `main` task) so we can append `not vfs`/`not live`
        # to the selector — the live-network vfs/live tests must not run in CI. Editing
        # the pixi `main` task in pyproject.toml would invalidate pixi.lock and fail the
        # lock-freshness check, so the deselection lives here instead.
        run: pixi run -e ${{ matrix.environment }} pytest -vvv --cov=src/pyramids -sv -m 'not plot and not interop and not vfs and not live' --cov-report=xml --cov-append --cov-fail-under=0

      - name: Run plot tests
        run: pixi run -e ${{ matrix.environment }} plot --cov-fail-under=0

      - name: Run interop tests
        run: pixi run -e ${{ matrix.environment }} interop-tests --cov-fail-under=84

      - name: Upload coverage reports to Codecov with GitHub Action
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1

      - name: test Jupyter notebooks
        run: pixi run -e ${{ matrix.environment }} notebooks

  extras-package:
    # id-token: write is scoped here (not workflow-level) for the Codecov OIDC upload.
    permissions:
      contents: read
      id-token: write
    # One job per optional-dependency group. Each job installs an env that HAS the
    # extra and RUNS that extra's tests, so they execute for real here instead of
    # skipping silently in the main matrix (whose envs omit these extras). Without a
    # job like this an extra's tests skip in every job and a regression merges green —
    # exactly what happened to tests/stac, which had no home until the `stac` target below.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        target:
          # Each target runs in an env that HAS its extra and selects its tests (by marker, or by
          # path where an env-specific routing is needed), so they EXECUTE here instead of skipping
          # in the main matrix (whose envs omit these extras). `markexpr` becomes the single -m
          # expression; `paths` scopes collection ("" = whole tree, then filtered by the marker).
          - { name: netcdf_lazy,    env: lazy,    paths: tests/netcdf/lazy,  markexpr: "not live" }
          - { name: parquet_lazy,   env: parquet, paths: tests/feature/lazy, markexpr: "not live" }
          # to_dask_dataframe is marked netcdf_lazy but its @requires_dask_dataframe tests need
          # pyarrow (the parquet extra), so run that one file in the parquet env where they execute
          # rather than skip. (A pure marker split can't express "this netcdf_lazy file in parquet".)
          - name: netcdf_parquet
            env: parquet
            paths: tests/netcdf/lazy/test_to_dask_dataframe.py
            markexpr: "not live"
          # parquet-marked tests (feature/test_arrow, feature/test_geoparquet, io/test_sniff,
          # stac/test_geoparquet*) live outside the dirs above, so they ran in NO CI job. Select them
          # by marker in the parquet env so they execute.
          - { name: parquet,        env: parquet, paths: "", markexpr: "parquet and not live" }
          # STAC is pure-Python but no main-matrix env installs it; run the whole stac suite (the
          # mock-client and real-client tests alike) in the dev env, which carries the stac feature.
          - { name: stac,           env: dev,     paths: "tests/stac tests/dataset/stac", markexpr: "not live" }

    steps:
      # No fetch-depth: the test suite reads the working tree, not git history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: serapeum-org/github-actions/actions/python-setup/pixi@38c111084f99d5ff5f4a1e63bedce48fe33a10c0  # pixi/v1.2.1
        with:
          environments: ${{ matrix.target.env }}
          activate-environment: ${{ matrix.target.env }}
          cache: true
          version: v0.73.0

      - name: Run ${{ matrix.target.name }} tests
        # ``--cov-fail-under=0`` overrides the 90% gate from
        # ``[tool.coverage.report]``; extras jobs are intentionally
        # narrow-scope and their coverage is aggregated with the main
        # job at Codecov.
        run: >-
          pixi run -e ${{ matrix.target.env }}
          pytest -vvv ${{ matrix.target.paths }} -m "${{ matrix.target.markexpr }}"
          --cov=src/pyramids --cov-report=xml --cov-report=term-missing
          --cov-fail-under=0

      - name: Upload coverage reports to Codecov with GitHub Action
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
