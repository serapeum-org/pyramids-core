# What every published wheel's bundled native stack must report.
#
# pyramids-core obtains that stack three different ways, and each route silently inherits its
# upstream's defaults for anything not explicitly requested:
#
#   source build  ci/source-build/          manylinux, musllinux   (both arches)
#   vcpkg         ci/vcpkg.json             win_arm64
#   conda-forge   ci/setup-gdal-from-pixi   win_amd64, macOS       (both arches)
#
# That is how one release shipped HDF5 with thread-safety ON for three platforms and OFF for the
# other two (#1620) while every version pin agreed, and it is why this file exists: the pins live in
# three places, so something has to compare the *built artifact* against one declaration (#1627).
#
# Only libraries whose version can be read reliably out of the shipped binary belong here. GDAL
# deliberately does not: a manylinux `libgdal` yields only a spurious "GDAL 3.6.0", macOS yields two
# candidates, and the Windows DLLs carry no version in their filename. GDAL version parity and the
# required-driver list are asserted from the *installed* wheel instead, where `osgeo.gdal` can be
# asked directly -- see ci/check-installed-stack.py.
#
# ci/check-bundled-stack.py reads this file and runs in every repair step, on the repaired wheel.

[libraries.hdf5]
# Thread-safety is the property that has already regressed. HDF5's CMake default is OFF, so every
# route that compiles its own HDF5 ships a non-threadsafe library unless it asks (#1620).
threadsafety = "ON"
# 2.2.0 is the newest upstream release and what the conda-forge route already ships; the source
# build is pinned to the same tarball in ci/source-build/config.sh.
version = "2.2.0"

# PROJ and GEOS carry a floor rather than an exact version, because no single value is reachable by
# all three routes: conda-forge's gdal 3.13.3 requires proj >= 9.9.0 and geos >= 3.15.0, while vcpkg's
# pinned baseline offers at most proj 9.8.1 and geos 3.14.1. Published 0.81.0 shipped 9.8.1/3.14.1 on
# four platforms and 9.9.0/3.15.0 on osx-64. Exact-matching something that cannot be equal would mean
# hand-maintaining exceptions that only ever record expected differences; a floor still fails the case
# worth catching -- a route silently dragging in an OLDER library than any other ships.
# `below_version` is an exclusive ceiling at the next major. The floor catches a route lagging; the
# ceiling catches the other failure a floor cannot see -- a route jumping a major version, which for
# PROJ or GEOS can change projection and geometry behaviour and must never land in a wheel
# unnoticed. Unlike a dependency pin this constrains no solver, so it costs nothing but a failed
# check when upstream genuinely moves, which is the reviewed-decision moment this file is for.
# Note the ceiling is tight for PROJ (on 9.x) and loose for GEOS, which has been 3.x for years.
[libraries.proj]
min_version = "9.8.1"
below_version = "10"

[libraries.geos]
min_version = "3.14.1"
below_version = "4"

[installed.gdal]
version = "3.13.3"

[installed.drivers]
# The same lists ci/source-build/build-gdal-stack.sh enforces, so the guarantee it gives the source
# build now covers the vcpkg and conda-forge wheels too.
raster = [
    "GTiff", "COG", "netCDF", "GRIB", "HDF5", "JP2OpenJPEG",
    "Zarr", "PNG", "JPEG", "WCS", "OGCAPI", "VRT",
]
vector = [
    "GeoJSON", "ESRI Shapefile", "GPKG", "GPX", "PMTiles", "MVT", "GML",
    "KML", "WFS", "OAPIF", "FlatGeobuf", "CSV", "OGR_VRT",
]

[exceptions.win_arm64.gdal]
version = "3.12.4"
reason = """
vcpkg's pinned builtin-baseline carries no gdal 3.13.x port -- its newest is 3.12.4
(port-version 2) -- so this platform is a minor version behind by force, not by choice. Revisit
when the vcpkg baseline is next bumped; see ci/vcpkg.json.
"""

# Platforms that cannot meet the baseline, with the reason. An exception is a reviewed decision, not
# a silent difference -- which is the whole point of the file. Keys are matched against the wheel's
# platform tag. An exception may relax a *version*; it never waives `threadsafety`.
[exceptions.win_arm64.hdf5]
version = "2.1.1"
reason = """
vcpkg's pinned builtin-baseline carries no hdf5 2.2.x port -- its newest is 2.1.1 (port-version 1) --
so this platform cannot reach the baseline version without moving the baseline itself. Revisit when
the vcpkg baseline is next bumped; see ci/vcpkg.json.
"""

# Properties that cannot be read from a wheel's bytes and are asserted from the *installed* package
# instead, by ci/check-installed-stack.py in the wheel smoke jobs. GDAL's version lives in the
# SONAME on Linux/macOS and nowhere in the Windows filename, and a driver list can only come from
# asking the library.
