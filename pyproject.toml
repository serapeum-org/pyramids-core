[project]
name = "pyramids-core"
version = "0.81.0"
description = "GIS utility package"
readme = {file = "README.md", content-type = "text/markdown"}
authors = [{ name = "Mostafa Farrag", email = "moah.farag@gmail.com" }]
license = "GPL-3.0-only"
license-files = ["LICENSE.md"]
keywords = ["GIS", "gdal"]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: GIS",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
]

requires-python = ">= 3.11, <4"

# GDAL is intentionally omitted from runtime deps: the platform wheel
# vendors osgeo, conda-forge users get gdal via the feedstock, sdist
# users install native GDAL out-of-band (see docs/installation.md).
# Listing pip's PyPI GDAL would force a from-source build on Windows
# (no wheel exists) and break most end-user pip installs.
dependencies = [
    # Both the win_arm64 AND the musllinux wheels vendor geopandas/pyogrio
    # into pyramids/_vendor/ and then drop (win_arm64 marker) or strip (musl
    # metadata edit) the real distributions — see ci/install-and-vendor-
    # osgeo.py and ci/strip-vendored-deps-from-wheel.py. The vendored packages
    # still import `packaging` (both) and `certifi` (pyogrio) at runtime, and
    # with the real distributions gone nothing else in the closure is
    # guaranteed to install them — pip stays satisfied while `import geopandas`
    # dies on a clean install. No PEP 508 marker distinguishes musl from glibc,
    # so declare both unconditionally: they are tiny pure-Python universal
    # wheels, already in the glibc closure via geopandas, and harmless
    # everywhere else.
    "certifi",
    "packaging",
    "cftime >=1.6.4",
    # win_arm64: shapely and pyogrio (geopandas' hard dep) ship no ARM64
    # wheels on PyPI, so requiring them would make the platform
    # uninstallable. The win_arm64 wheel vendors the whole vector stack
    # (shapely + geopandas + pyogrio) under pyramids/_vendor/ instead —
    # see ci/install-and-vendor-osgeo.py. Every other platform resolves
    # these normally; drop the markers when upstream ships ARM64 wheels.
    "geopandas >=1.0.0 ; sys_platform != 'win32' or platform_machine != 'ARM64'",
    "hpc-utils >=0.1.5",
    "numpy >=2.0.0",
    "pandas >=2.0.0",
    "pyproj >=3.7.0",
    "PyYAML >=6.0.0",
    "Shapely >=2.1.0 ; sys_platform != 'win32' or platform_machine != 'ARM64'",
    "scipy >=1.10.0",
]

[project.optional-dependencies]
viz = ["cleopatra[tiles]>=0.46.1"]
# Core's own eager GeoParquet (`read_parquet` / `to_parquet`) via pyarrow + geopandas; needs no
# backend. The lazy vector path (dask-geopandas) moved to `pyramids-lazy[parquet]` and is no
# longer pulled here -- LazyFeatureCollection raises the branded hint without it.
parquet = ["pyarrow>=10.0.0"]
stac = ["pystac-client>=0.8.4", "stac-asset>=0.4.7"]

[dependency-groups]
# Test-only peer dep for the to_xarray / from_xarray methods; deliberately not a published
# extra. The same-named `interop` pixi feature maps to this group.
interop = ["xarray>=2023.1.0"]
# The ONLY core group that installs the plugin. pyramids-lazy is a backend plugin (discovered via
# the `pyramids.compute_backend` entry point) exactly like pyramids-eo / pyramids-mesh — core's main
# test envs install NO plugin and all heavy lazy testing lives in the pyramids-lazy repo. This small
# `e2e` group exists only for the handful of smoke tests that need a real backend AND a core-only
# test dep the plugin must not carry: the lazy PLOT tests (need cleopatra) and the chunked xarray
# INTEROP tests (need xarray). Released version only — they exercise netcdf lazy methods already on
# PyPI, so this never gates on an unreleased plugin. The same-named `e2e` pixi feature maps here.
e2e = ["pyramids-lazy[parquet]>=0.2.0"]
dev = [
    "nbval >=0.11.0",
    "pre-commit >=4.6.2",
    "pre-commit-hooks >=6.0.0",
    "ruff>=0.15.22",
    "pytest >=8.2.2",
    "pytest-cov >= 5.0.0",
    "pytest-env>=1.6.0",
    "coverage",
    "build>=1.0.0",
    "twine>=5.0.0",
    "pip",
    # Security floor: PYSEC-2026-4055/4056/4057 (extension-manager argument injection,
    # language-pack Plural-Forms RCE, trusted-output paste XSS).
    "jupyterlab>=4.6.4",
    # Security floor: PYSEC-2026-4112. The `docs` feature's `notebook<7.0` below is a
    # different, unaffected line, not a contradiction of this floor.
    "notebook>=7.6.3",
    "jupyter",
    # Security floor: CVE-2026-86049. Reached only transitively -- drop this pin once
    # jupyterlab/notebook pull 2.21.0 or later on their own.
    "jupyter-server>=2.21.0",
    "commitizen>=4.8.4",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0.0",
    "pytest-mock>=3.12.0",
    "pytest-timeout>=2.3.0",
    "pytest-benchmark>=5.1.0",
    "pytest-xdist>=3.6.1",
    # Security floor (transitive via pytest-xdist): CVE-2026-112913 affects filelock <4.2.1.
    "filelock>=4.2.1",
    # Dev/CI only: keeps scipy 2.0 from floating in on a lock regen. The published
    # [project.dependencies] floor stays uncapped so users are not held back.
    "scipy>=1.17.1,<2"
]
docs = [
    "mkdocs >=1.5.3",
    "mkdocs-material >=9.5.3",
    "mkdocstrings >=0.24.0",
    "mkdocstrings-python >=1.7.5",
    "mike >=2.1.3",
    "mkdocs-jupyter >=0.25.1",
    "mkdocs-autorefs  >=1.2",
    "mkdocs-macros-plugin  >=1.3.7",
    "mkdocs-table-reader-plugin  >=3.1.0",
    "mkdocs-mermaid2-plugin  >=1.2.1",
    "jupyter-contrib-nbextensions  >=0.7.0",
    "mkdocs-panzoom-plugin",
    "notebook<7.0",
    # For the mkdocs-deploy notebook-execution step (imports them + registers the python3 kernel).
    "jupyter",
    "nbconvert",
    "ipykernel",
]


[project.scripts]
pyramids = "pyramids.cli:main"

[project.urls]
homepage = "https://github.com/serapeum-org/pyramids-core"
repository = "https://github.com/serapeum-org/pyramids-core"
documentation = "https://serapeum-org.github.io/pyramids-core"
Changelog = "https://github.com/serapeum-org/pyramids-core/blob/main/docs/change-log.md"


[build-system]
requires = ["setuptools>=80.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pyramids", "pyramids.*"]

[tool.setuptools.package-data]
# YAML glob scoped to base/data/ so future test fixtures or plot
# configs dropped under src/pyramids/ don't auto-ship in every wheel.
pyramids = [
    "base/data/*.yaml",
    "_vendor/osgeo/**/*",
    "_vendor/osgeo_utils/**/*",
    # win_arm64 vector stack (empty matches on every other platform): the
    # vendored packages' .py files ship via package discovery, but the
    # compiled extensions (shapely/lib.pyd, pyogrio/_io.pyd, ...) are
    # data files and need explicit globs. Their GEOS/GDAL DLLs are NOT
    # vendored here — the wheel's delvewheel pass bundles one shared
    # copy into pyramids_core.libs and rewrites the import tables.
    "_vendor/shapely/**/*",
    "_vendor/geopandas/**/*",
    "_vendor/pyogrio/**/*",
    "_vendor/cftime/**/*",
    "_data/gdal_data/*",
    "_data/proj_data/*",
    "_data/gdalplugins/*",
    # curl CA bundle re-pointed by the runtime bootstrap so vendored-GDAL
    # /vsicurl HTTPS reads find trust anchors in the consuming env (#412).
    "_data/ssl/*",
    # Third-party license texts auto-vendored by
    # ci/install-and-vendor-osgeo.py from each conda-forge package's
    # info/licenses/. Required by MIT/BSD/LGPL attribution clauses for
    # every native lib bundled in pyramids_core.libs/. See
    # docs/about/THIRD_PARTY_LICENSES.md for the human-readable index.
    "_licenses/**/*",
]

[tool.ruff]
line-length = 88
target-version = "py311"  # requires-python floors at 3.11

[tool.ruff.format]
# black had skip-string-normalization = true → preserve existing quotes.
quote-style = "preserve"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E203", "E226", "E266", "E501", "E701", "E722", "C901", "E741", "E731"]

[tool.ruff.lint.per-file-ignores]
# tests/examples: keep only import-sort (I), skip E/F/W/UP lint churn.
"tests/**" = ["E", "F", "W", "UP"]
"examples/**" = ["E", "F", "W", "UP"]
# Notebooks import at first use / run setup before imports, so E402 is expected.
"*.ipynb" = ["E402"]

[tool.bandit]
# ci/ etc. are non-shipped build tooling run with trusted fixed commands.
exclude_dirs = ["ci", "tests", "examples", "scripts", "planning", "docs"]
skips = ["B101"]

[tool.coverage.run]
branch = true
source = ["src/pyramids"]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.mypy]
# Not `requires-python`'s 3.11: numpy 2.5's stubs use PEP 695 `type` statements that mypy only
# parses at target >= 3.12, and at 3.11 it aborts before checking any source. 3.11 runtime
# compatibility is covered by the py311 test leg instead.
python_version = "3.12"
mypy_path = "src"
packages = ["pyramids"]
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = false
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
exclude = [
    "tests/",
    "examples/",
    "docs/",
    "scripts/",
    "planning/",
]

[[tool.mypy.overrides]]
# cleopatra ships inline types (the TypedDicts PlotKwargs/AnimateKwargs, the ColorBar /
# PointOverlay / Basemap dataclasses, ...) but no `py.typed` marker yet, so the global
# `ignore_missing_imports` would collapse them to `Any` and break `Unpack[PlotKwargs]`.
# Follow its source types instead. Drop once cleopatra ships `py.typed`.
module = "cleopatra.*"
ignore_missing_imports = false
follow_untyped_imports = true

[[tool.mypy.overrides]]
# render_array is the single dynamic-dispatch backend: it splits **kwargs into ctor /
# render buckets at runtime (keyed on ArrayGlyph.option_keys()) and splats them into
# cleopatra's now-typed plot/animate/facet. mypy cannot verify a runtime-built **dict
# against a typed signature, so `arg-type` here is a wall of false positives (the 1367
# plot tests prove the routing). Suppress just that code for this one module.
module = "pyramids.dataset._plot_helpers"
disable_error_code = ["arg-type", "no-any-return"]

[[tool.mypy.overrides]]
module = "pyramids.dataset.ops.*"
disable_error_code = [
    "attr-defined", "call-arg", "misc", "return-value",
    "assignment", "union-attr", "no-any-return", "arg-type",
]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "$version"
changelog_file = "docs/change-log.md"
update_changelog_on_bump = true
style = [
    ["qmark", "fg:#ff9d00 bold"],
    ["question", "bold"],
    ["answer", "fg:#ff9d00 bold"],
    ["pointer", "fg:#ff9d00 bold"],
    ["highlighted", "fg:#ff9d00 bold"],
    ["selected", "fg:#cc5454"],
    ["separator", "fg:#cc5454"],
    ["instruction", ""],
    ["text", ""],
    ["disabled", "fg:#858585 italic"]
]

[tool.pytest.ini_options]
env = ["MPLBACKEND=Agg"]
pythonpath = ["src"]
testpaths = ["tests"]
timeout = 300
faulthandler_timeout = 120
markers = [
    "vfs: mark a test as a virtual file system (deselect with '-m \"not vfs\"')",
    "slow: mark test as slow (deselect with '-m \"not slow\"')",
    "fast: mark test as fast (deselect with '-m \"not fast\"')",
    "e2e: end-to-end test (full read/write/compute path); select '-m e2e', deselect '-m \"not e2e\"'",
    "core: extras-free test (auto-applied when no extras marker is present)",
    "plot: tests requiring the [viz] extra (cleopatra) — plotting tests (deselect with '-m \"not plot\"')",
    # One marker per [project.optional-dependencies] group. Each marker
    # auto-skips when the extra's headline dep isn't importable — see
    # ``tests/_marks.py`` + ``pytest_collection_modifyitems``. ``viz`` is
    # spelled ``plot`` above; don't register a duplicate.
    "lazy: tests requiring the pyramids-lazy backend (the dask/zarr compute plugin)",
    "interop: tests requiring the optional interop peer dependency",
    # netcdf_lazy is deliberately NOT folded into lazy: it gates on EXTRA modules beyond the
    # base extra's headline dep, so a test marked merely `lazy` would not skip when
    # kerchunk/h5py are the missing piece. Kept distinct so the skip is precise; see
    # tests/_marks.py. (parquet_lazy left with the lazy vector tests for pyramids-lazy.)
    "netcdf_lazy: tests needing kerchunk + h5py on top of the [lazy] stack (zarr/dask); stricter than `lazy`",
    "parquet: tests requiring the [parquet] extra (pyarrow)",
    "stac: tests requiring the [stac] extra (pystac-client)",
    "live: live network test against a real external service (deselect with '-m \"not live\"', run with '-m live')",
    # Not an extras gate: `@pytest.mark.samples(*flags)` narrows a NetCDF sample-file test to the
    # sample files carrying those capability flags (see tests/netcdf/samples/conftest.py).
    "samples: narrow a NetCDF sample-file test to the files carrying the given capability flags",
]


[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "linux-aarch64", "osx-arm64", "osx-64"]

[tool.pixi.pypi-dependencies]
# Just the editable install of core itself. The extras above are the *published* contract (wheel
# metadata + the conda-forge recipe), and pixi maps each one to a same-named feature, so the
# dev/CI/docs envs install them as pip wheels -- closest to what a user actually gets. Only what
# PyPI cannot safely supply stays conda: GDAL, and anything linking the same native HDF5 (see the
# `gdal` and `lazy` features below).
pyramids-core = { path = ".", editable = true }

[tool.pixi.tasks]
main = { cmd = "pytest -vvv --cov=src/pyramids -sv -m 'not plot and not interop' --cov-report=xml", description = "Run the main test suite" }
plot = { cmd = "pytest -vvv --cov=src/pyramids --cov-append -sv -m 'plot' --cov-report=xml", description = "Run plot test suite" }
interop-tests = { cmd = "pytest -vvv --cov=src/pyramids --cov-append -sv -m 'interop' --cov-report=xml", description = "Run the NetCDF interop tests" }
test-all = { cmd = "pytest -vvv --cov=src/pyramids -sv --cov-report=xml --cov-report=term-missing", description = "Run all testsuite" }
notebooks = { cmd = "pytest --nbval --nbval-lax --verbose docs/examples --ignore-glob='docs/examples/**/dask-lazy-*.ipynb' --ignore-glob='docs/examples/dask/*.ipynb' --ignore-glob='docs/examples/**/lazy-*-complete.ipynb' --ignore-glob='docs/examples/**/stac-cloud-*.ipynb' --ignore-glob='docs/examples/zarr/*.ipynb' --ignore-glob='docs/examples/dataset/wms-wmts-readers.ipynb' --ignore-glob='docs/examples/dataset/plotting-gallery.ipynb'", description = "check notebooks (skips dask cookbooks/quickstarts, stac-cloud-*, zarr/*, wms-wmts-readers and the dataset plotting-gallery — all need extras envs, real endpoints or the digitalearth extra)" }
jupyter = { cmd = "jupyter lab --no-browser --IdentityProvider.token='' --ServerApp.password='' --port=8889", description = "launch JupyterLab to run the example notebooks — run with `-e dev` (only env with JupyterLab + all notebook deps)" }
build-dist = { cmd = "python -m build", description = "Build sdist and wheel for PyPI" }
publish-pypi = { cmd = "twine upload --non-interactive --repository pypi dist/*", depends-on = ["build-dist"], description = "Build and upload package to PyPI" }
cz-changelog = { cmd = "cz changelog", description = "Generate changelog using Commitizen" }
cz-bump = { cmd = "cz bump", description = "Bump version using Commitizen" }
mypy = { cmd = "mypy", description = "Run mypy type checking" }
benchmark = { cmd = "pytest benchmarks --benchmark-only --benchmark-columns=min,median,mean,stddev,rounds", description = "Run the performance benchmarks (benchmarks/, excluded from the normal test tasks)" }

# Declared as a sub-table so the lines fit the project's width; it must stay
# after every inline entry above, since a sub-table header ends the parent.
[tool.pixi.tasks.test-fast]
# `--dist loadfile` keeps one module's tests on one worker, so fixtures that
# build a shared GDAL handle per file are not raced across processes.
cmd = "pytest -q -n auto --dist loadfile -m 'not plot and not interop'"
description = "Run the main suite in parallel (pytest-xdist); no coverage"


[tool.pixi.environments]
# Every env lists the shared `gdal` feature so the single GDAL pin reaches all of
# them, incl. no-default-feature wheel-build. tests/test_gdal_pin.py enforces it.
default = {features = ["gdal", "viz"], solve-group = "default" }
# Bare core with a test runner but NO lazy backend and NO dask stack -- the environment shape the
# branded-absent suite (tests/base/test_lazy_backend_absent.py) describes. That suite forces the
# absent state via monkeypatch, so this env proves the install/import shape, not the contract on its
# own. Deliberately omits `lazy` (so no backend).
bare = { features = ["gdal", "dev"], solve-group = "bare" }
dev = { features = ["gdal", "viz", "dev", "interop", "lazy", "stac", "parquet"], solve-group = "default" }
lazy = { features = ["gdal", "viz", "dev", "lazy"], solve-group = "default" }
parquet = { features = ["gdal", "viz", "dev", "interop", "lazy", "parquet"], solve-group = "default" }
# e2e: the ONE core env that installs the plugin (the `e2e` group), for the small lazy-plot +
# chunked-interop smoke tests that need a real backend plus cleopatra/xarray. Its own solve-group so
# the plugin (and the dask it brings) never leaks into the plugin-free main envs above. Run as a
# separate CI step; `-m e2e` selects it.
e2e = { features = ["gdal", "viz", "dev", "interop", "lazy", "e2e"], solve-group = "e2e" }
# `docs` also carries the notebook runtime features (viz/cleopatra, interop, lazy, stac,
# parquet) so the mkdocs-deploy action can execute the example notebooks in CI and render
# real outputs. See .github/workflows/github-pages-mkdocs.yml (notebooks-path).
docs = { features = ["gdal", "docs", "viz", "interop", "lazy", "stac", "parquet"], solve-group = "docs" }
# py3XX envs include `lazy` so the `interop-tests` step has the interop data stack
# (zarr / dask / s3fs / fsspec) its interop tests need, run with real deps. `parquet`
# (pyarrow) is left out on purpose: it would un-skip the core OGR-Parquet tests, which
# need GDAL's libgdal-arrow-parquet driver (absent on the runners) — the parquet extras
# matrix covers those. Bare-core (no-lazy) installs are covered by the `default` env.
py311 = { features = ["gdal", "py311", "viz", "dev", "interop", "lazy"], solve-group = "py311" }
py312 = { features = ["gdal", "py312", "viz", "dev", "interop", "lazy"], solve-group = "py312" }
py313 = { features = ["gdal", "py313", "viz", "dev", "interop", "lazy"], solve-group = "py313" }
py314 = { features = ["gdal", "py314", "viz", "dev", "interop", "lazy"], solve-group = "py314" }
py315 = { features = ["gdal", "py315", "viz", "dev", "interop", "lazy"], solve-group = "py315" }
# wheel-build: lean env inside the cibuildwheel container.
# no-default-feature = true keeps pyramids-core (and its pandas/numpy
# transitive deps) out of the build container so cibuildwheel's pip
# can resolve them against the target Python's manylinux wheels.
wheel-build = { features = ["gdal", "wheel-build"], solve-group = "wheel-build", no-default-feature = true }


[tool.pixi.feature.py311.dependencies]
python = "3.11.*"
[tool.pixi.feature.py312.dependencies]
python = "3.12.*"
[tool.pixi.feature.py313.dependencies]
python = "3.13.*"
[tool.pixi.feature.py314.dependencies]
# Pin the standard-GIL ABI. conda-forge ships two Python 3.14 builds at the same
# version — *_cp314 (GIL) and *_cp314t (free-threaded / no-GIL, PEP 703) — and a
# bare "3.14.*" lets the solver pick either, inconsistently per platform. pyramids
# has thread-sensitive code (per-thread GDAL handles, base/_locks.py), so the 3.14
# leg must test one intended ABI. Free-threaded would be a separate opt-in leg.
python = { version = "3.14.*", build = "*_cp314" }

[tool.pixi.feature.py315.dependencies]
# Pin the standard-GIL ABI, same reasoning as py314 above: conda-forge ships
# *_cp315 (GIL) and *_cp315t (free-threaded) at one version, and pyramids'
# thread-sensitive code must test the GIL build. Free-threaded is a separate
# opt-in leg (#683).
python = { version = "3.15.*", build = "*_cp315" }

# Pin the docs env to Python 3.14 (standard-GIL cp314), matching dev/py314. None of the
# docs env's features (gdal/docs/viz/interop/lazy/stac/parquet) pin Python, and
# requires-python floors at 3.11 with no upper cap below 4, so a re-solve otherwise floats
# the docs env to the newest Python. The jupyter docs stack is not 3.15-ready:
# mkdocs-jupyter -> jupytext -> jupyter_client runs datetime.strptime("1", "%d") at import,
# which CPython 3.15 rejects (gh-70647), so `mkdocs build --strict` fails to load the
# plugin. Drop this pin once the jupyter stack supports 3.15.
[tool.pixi.feature.docs.dependencies]
python = { version = "3.14.*", build = "*_cp314" }

[tool.pixi.feature.parquet.pypi-dependencies]
# Core's own eager GeoParquet stack (pyarrow) for the `parquet`-marked tests — the same `pyarrow`
# as the published `[project.optional-dependencies].parquet` extra, pulled here so the dev/parquet/
# docs envs can exercise it. The LAZY vector path (dask-geopandas, via pyramids-lazy[parquet]) is
# the plugin's concern: its tests live in pyramids-lazy's own suite, so core installs no plugin
# here. Scoped to the `parquet` feature so it reaches dev/parquet/docs but never the pyarrow-free
# py3XX legs.
pyarrow = ">=10.0.0"

[tool.pixi.feature.lazy.dependencies]
# Conda only for what PyPI cannot safely supply here. h5py/hdf5: a PyPI h5py bundles its own HDF5,
# which DLL-shadows the one conda's libgdal-netcdf links against, so the hdf5 pin forces h5py onto
# that same binary. h5py 3.16 added hdf5 2.x builds while still shipping 1.14.6-linked ones, which
# is why the pin selects 1.14 and `<3.17` holds the line until a 3.17 is vetted (an hdf5 2.x
# migration is already blocked here). zarr: it drags numcodecs, which ships no cp315 Windows wheel,
# so PyPI falls back to a source build that fails on the py315 leg. The rest comes from the [lazy]
# extra via pyramids-lazy: dask/distributed/s3fs resolve from PyPI, while fsspec arrives as a conda
# transitive of zarr/kerchunk (checked in the lock: 46 conda entries, 0 PyPI). s3fs pins fsspec in
# lockstep, so that cross-channel pairing needs a look on the next regen.
zarr = ">=3"
kerchunk = ">=0.2.10"
h5py = ">=3.8.0,<3.17"
hdf5 = "1.14.*"


# Single source of truth for the conda GDAL pin (SWIG osgeo bindings are ABI-locked to
# libgdal). Listed by every environment; ci/gdal-pin.py and ci/setup-gdal-micromamba.sh
# read it so CI installs the same range. Bump all five together on a new gdal minor.
# libgdal-jp2openjpeg ships the JP2OpenJPEG driver (pulls openjpeg) so the bundled GDAL
# can read JPEG2000-packed GRIB2 (WMO template 5.40 — NCEP/ECCC/ECMWF); see issue #600.
# Effectively-exact pins (single-patch window, not open ranges): GDAL
# versions are bumped deliberately, in one review, across all build
# models — ci/source-build/config.sh is the canonical pin (Linux
# wheels), this block mirrors it for the conda-extract wheels
# (macOS/win_amd64) and the dev envs, and ci/vcpkg.json's overrides pin
# the win_arm64 canary. Operator-leading form on purpose: ci/gdal-pin.py
# consumers build conda matchspecs as "gdal${SPEC}", so a digit-leading
# spec like "3.13.1.*" concatenates into a nonexistent package name
# (observed: micromamba "gdal3.13.1.* does not exist", macOS x86_64; the
# same failure applies verbatim to 3.13.3.*).
[tool.pixi.feature.gdal.dependencies]
gdal = ">=3.13.3,<3.13.4"
libgdal-netcdf = ">=3.13.3,<3.13.4"
libgdal-hdf4 = ">=3.13.3,<3.13.4"
libgdal-grib = ">=3.13.3,<3.13.4"
libgdal-jp2openjpeg = ">=3.13,<3.14"

# swig builds the osgeo bindings against libgdal; build-only, so it stays in the
# wheel-build feature (not the shared gdal feature). setup-gdal-micromamba.sh reads it.
[tool.pixi.feature.wheel-build.dependencies]
swig = ">=4.3,<5"
# This no-default-feature env used to float Python to the newest available with no ABI
# constraint, so the solver picked the free-threaded *_cp314t build on osx-64 and win-64
# while the py314 env used *_cp314 — a per-platform ABI mismatch in the lock. Pin it to
# the same standard-GIL 3.14 build so wheel-build and py314 agree everywhere. This also
# freezes the env at 3.14 (no longer floating): intended, since cibuildwheel provides its
# own target interpreters and this env's Python only drives the build toolchain. It stays
# on 3.14 through the cp315 wheels on purpose: cibuildwheel supplies the real cp315 target
# interpreter, so this env needs no cp315 build at all. (The separate py315 *conda* env used
# by tests.yml does exist — see [tool.pixi.environments].py315 — it just does not need this
# toolchain env bumped.)
python = { version = "3.14.*", build = "*_cp314" }

# libstdcxx-ng provides the GCC-13 libstdc++.so.6 that conda-forge's GDAL
# is built against. Only relevant to the conda-extract model — the Linux
# wheels build from source (ci/source-build/) inside the manylinux image
# and never touch this pixi env; it is kept for local conda-extract runs
# (e.g. reproducing the macOS/Windows flow on a Linux box).
[tool.pixi.feature.wheel-build.target.linux-64.dependencies]
libstdcxx-ng = "*"

[tool.pixi.feature.wheel-build.target.linux-aarch64.dependencies]
libstdcxx-ng = "*"


[tool.pixi.dependencies]
# The GDAL pin lives in the shared `gdal` feature, not here (see above).
# cftime decodes non-standard NetCDF calendars (360_day, noleap, julian, ...)
# in pyramids.netcdf.utils — reachable from core NetCDF reads, so it is a core dep.
cftime = ">=1.6.4"
# Conda-forge's geopandas-base no longer pulls in a vector-IO backend.
# pyogrio is required for GeoDataFrame.to_file / read_file on every env.
pyogrio = ">=0.7"


[tool.cibuildwheel]
# Single place to add a new Python version — beats juggling CIBW_BUILD
# across the three per-OS workflow jobs.
build = ["cp311-*", "cp312-*", "cp313-*", "cp314-*", "cp315-*"]
# Excludes for build IDs that match `build` but we don't want (PyPy,
# musllinux, and every free-threaded CPython — pyramids has thread-sensitive
# code, see tests/guards/test_python_abi_pin.py. `cp31*t-*` covers cp311t-cp319t,
# so a new version never silently gains a free-threaded wheel).
skip = ["*pp*", "*musllinux*", "cp31*t-*"]
archs = ["auto64"]
build-verbosity = 3
# cibuildwheel's in-container self-test is skipped: the wheels are
# exercised far more thoroughly by bundle-pypi-wheels.yml's test-wheels
# matrix (4 OSes x cp311-cp315) and the verify-debian12 / verify-rocky9 /
# verify-alpine full-suite jobs, so a container smoke test would add
# minutes per build for no extra signal.
test-skip = "*"

# PACKAGE_DATA is repeated in each per-platform
# [tool.cibuildwheel.<platform>.environment] block below: cibuildwheel REPLACES the
# `environment` table across overrides (not merges, despite docs), so hoisting them
# to a shared block silently broke every build ("PACKAGE_DATA != 1"; commit 607d3153).

[tool.cibuildwheel.linux]
# Linux wheels are built FROM SOURCE (#332): ci/source-build/config.sh
# compiles the curated GDAL dependency stack with the build image's own
# toolchain, so no symbol exceeds the image's glibc baseline and the wheel
# tags manylinux_2_28 (Ubuntu 20.04+ / Debian 11+ / RHEL 8+ / AL2023).
# macOS/Windows keep the conda-extract model (setup-gdal-from-pixi.*).
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
before-all = ["bash ./ci/source-build/build-gdal-stack.sh"]
# install-and-vendor-osgeo.py runs pip WITH build isolation so it picks
# up setuptools>=77 (GDAL's build-system.requires) and a matching
# numpy. Without isolation, the manylinux container's pre-installed
# setuptools 75.5.0 rejects GDAL's PEP 639 license string.
before-build = ["python ./ci/install-and-vendor-osgeo.py"]
# auditwheel walks the .so dep graph, bundles libgdal + transitive deps
# into pyramids_core.libs/, and rewrites RPATH. Tag = the build image's own
# floor (the whole point of the from-source stack). ${AUDITWHEEL_ARCH} is
# auto-exported by cibuildwheel inside the container (x86_64/aarch64).
# The musl canary jobs in bundle-pypi-wheels.yml override --plat to
# musllinux_1_2_* via CIBW_REPAIR_WHEEL_COMMAND.
repair-wheel-command = [
    "export LD_LIBRARY_PATH=/usr/local/lib:/usr/local/lib64",
    "auditwheel repair --plat manylinux_2_28_${AUDITWHEEL_ARCH} -w {dest_dir} {wheel}",
    "python ci/check-bundled-stack.py {dest_dir}",
]

[tool.cibuildwheel.linux.environment]
# GDAL_VERSION is pinned in ci/source-build/build-gdal-stack.sh (which also
# writes ${BUILD_PREFIX}/GDAL_VERSION for install-and-vendor-osgeo.py); bump
# it together with ci/source-build/config.sh's dep pins.
BUILD_PREFIX = "/usr/local"
GDAL_DATA = "/usr/local/share/gdal"
PROJ_DATA = "/usr/local/share/proj"
PROJ_LIB = "/usr/local/share/proj"
PACKAGE_DATA = "1"
LD_LIBRARY_PATH = "/usr/local/lib:/usr/local/lib64"


# macOS: same pixi/conda-forge flow as Linux, but with .dylib +
# delocate-wheel (macOS equivalent of auditwheel) instead of patchelf.
# Pip build-isolation rationale is the same as the Linux block above.
[tool.cibuildwheel.macos]
before-all = ["bash ./ci/setup-gdal-from-pixi.sh"]
before-build = ["python ./ci/install-and-vendor-osgeo.py"]
# DYLD_LIBRARY_PATH lives in the .macos.environment block so every
# subprocess (before-build, build, repair) inherits the same value.
repair-wheel-command = [
    "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} {wheel}",
    "python ci/check-bundled-stack.py {dest_dir}",
]

[tool.cibuildwheel.macos.environment]
# /usr/local needs sudo on GitHub macOS runners — use $HOME instead.
BUILD_PREFIX = "/Users/runner/gdal-prefix"
GDAL_DATA = "/Users/runner/gdal-prefix/share/gdal"
PROJ_DATA = "/Users/runner/gdal-prefix/share/proj"
PROJ_LIB = "/Users/runner/gdal-prefix/share/proj"
PACKAGE_DATA = "1"
DYLD_LIBRARY_PATH = "/Users/runner/gdal-prefix/lib"
# 11.0 = Big Sur; required floor for the arm64 build, safe for x86_64.
MACOSX_DEPLOYMENT_TARGET = "11.0"


# Windows: conda's Library/ nesting + delvewheel for repair.
[tool.cibuildwheel.windows]
before-all = ["powershell -File ci/setup-gdal-from-pixi.ps1"]
before-build = [
    # delvewheel is the only tool we install explicitly (needed for the
    # repair command); setuptools/wheel/numpy arrive via pip's build
    # isolation when install-and-vendor-osgeo.py runs.
    "python -m pip install delvewheel",
    "python ci/install-and-vendor-osgeo.py",
]
# --analyze-existing makes delvewheel walk the dep graph of DLLs ALREADY
# inside the wheel (the GDAL plugins at pyramids/_data/gdalplugins/).
# Without it, gdal_netCDF.dll / gdal_HDF*.dll ship without their
# transitive deps (netcdf.dll, hdf5.dll, …) and NetCDF/HDF open fails at
# runtime with "not recognized as being in a supported file format".
repair-wheel-command = [
    "delvewheel repair --analyze-existing --add-path C:/gdal-prefix/Library/bin -w {dest_dir} {wheel}",
    "python ci/check-bundled-stack.py {dest_dir}",
]

[tool.cibuildwheel.windows.environment]
# Forward slashes survive bash/PowerShell/cmd interpolation without
# double-backslash escaping; Windows treats /, \, and mixed paths
# equivalently for built-in APIs.
BUILD_PREFIX = "C:/gdal-prefix"
GDAL_DATA = "C:/gdal-prefix/Library/share/gdal"
PROJ_DATA = "C:/gdal-prefix/Library/share/proj"
PROJ_LIB = "C:/gdal-prefix/Library/share/proj"
PACKAGE_DATA = "1"
PATH = "C:/gdal-prefix/Library/bin;$PATH"
